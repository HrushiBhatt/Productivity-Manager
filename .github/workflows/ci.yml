name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./... # the engine and hub are concurrent, so always test under the race detector

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t brew-focus .

  # Publishes the site to the gh-pages branch. GitHub's own "pages build and deployment"
  # workflow then deploys it. One-time setup: Settings → Pages → Source: Deploy from a
  # branch → gh-pages / (root).
  pages:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the gh-pages branch
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Pages serves static files only, so this build runs the backend in the browser.
      - run: npx ng build --configuration pages --base-href "/${{ github.event.repository.name }}/"
        working-directory: frontend
      - name: Publish to gh-pages
        working-directory: frontend/dist/brew-focus/browser
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp index.html 404.html   # deep links like /progress still boot the app
          touch .nojekyll          # serve the files as-is, without a Jekyll pass
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
