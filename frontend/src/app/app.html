<div class="app">
  @if (auth.user(); as user) {
    <header class="header">
      <a class="logo" routerLink="/">
        <span class="logo-icon" aria-hidden="true">☕</span>
        <span class="logo-text">Brew Focus</span>
      </a>
      <nav class="tabs" aria-label="Views">
        <a class="tab px" routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Brew</a>
        <a class="tab px" routerLink="/progress" routerLinkActive="active" ariaCurrentWhenActive="page">Progress</a>
      </nav>
      <div class="account">
        <span
          class="live"
          [class.on]="live.connected()"
          [title]="live.connected() ? 'Synced live with your other tabs and devices' : 'Reconnecting to the server…'"
          >{{ live.connected() ? 'LIVE' : 'OFFLINE' }}</span
        >
        <span class="user" [title]="user.email">{{ user.name }}</span>
        <button class="icon-btn settings-btn px" (click)="brew.dialog.set('settings')" aria-label="Settings">
          <app-sprite class="icon" [rows]="gear" />
        </button>
      </div>
    </header>
  }

  <router-outlet />

  @switch (brew.dialog()) {
    @case ('intention') {
      <app-intention-dialog />
    }
    @case ('breathe') {
      <app-breathing-dialog />
    }
    @case ('reflect') {
      <app-reflection-dialog />
    }
    @case ('settings') {
      <app-settings-dialog />
    }
  }

  <div #toast class="toast px" popover="manual" [class.show]="toasts.current().visible" role="status" aria-live="polite">
    {{ toasts.current().message }}
  </div>
</div>
