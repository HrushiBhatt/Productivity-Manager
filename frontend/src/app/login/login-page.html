<main class="welcome">
  <app-pixel-mug class="mug" [fill]="1" [running]="true" />
  <h1 class="title">Brew Focus</h1>
  <p class="tagline">Focus sessions that run on the server, follow you across devices, and add up to habits.</p>

  <section class="card panel px">
    <div class="switch-row" role="tablist" aria-label="Account">
      <button class="seg px" role="tab" [attr.aria-selected]="mode() === 'login'" (click)="switchTo('login')">Log in</button>
      <button class="seg px" role="tab" [attr.aria-selected]="mode() === 'register'" (click)="switchTo('register')">Sign up</button>
    </div>

    <form class="modal-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (mode() === 'register') {
        <label class="field">
          Name <span class="optional">(optional)</span>
          <input class="input px" formControlName="name" autocomplete="name" maxlength="60" />
        </label>
      }
      <label class="field">
        Email
        <input class="input px" type="email" formControlName="email" autocomplete="email" />
      </label>
      <label class="field">
        Password
        <input
          class="input px"
          type="password"
          formControlName="password"
          [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
        />
      </label>
      @if (error()) {
        <p class="form-error" role="alert">{{ error() }}</p>
      }
      <button class="btn btn-primary px" [disabled]="busy()">
        {{ busy() ? 'Brewing…' : mode() === 'login' ? 'Log in' : 'Create account' }}
      </button>
    </form>
  </section>
</main>
