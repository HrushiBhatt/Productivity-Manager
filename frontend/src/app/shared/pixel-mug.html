<div class="mug-glow"></div>
<svg class="steam" viewBox="0 0 60 40" aria-hidden="true">
  @for (puff of steam; track $index) {
    <g>
      @for (p of puff; track $index) {
        <rect [attr.x]="p[0]" [attr.y]="p[1]" width="4" height="4" [attr.fill]="'rgba(255,255,255,' + (0.6 - $index * 0.1) + ')'" />
      }
    </g>
  }
</svg>
<svg class="mug-svg" viewBox="0 0 200 220" shape-rendering="crispEdges" aria-hidden="true">
  @for (r of body; track $index) {
    <rect [attr.x]="r[0]" [attr.y]="r[1]" [attr.width]="r[2]" [attr.height]="r[3]" [attr.fill]="r[4]" />
  }
  <rect x="24" [attr.y]="top()" width="136" [attr.height]="level()" fill="#6F4E37" />
  @if (level() >= 8) {
    <rect x="24" [attr.y]="top() - 8" width="136" height="8" fill="#A67C52" />
    <rect x="32" [attr.y]="top()" width="8" height="8" fill="#8B6B4C" opacity="0.5" />
    <rect x="40" [attr.y]="top()" width="8" height="8" fill="#8B6B4C" opacity="0.3" />
  }
  @for (r of frame; track $index) {
    <rect [attr.x]="r[0]" [attr.y]="r[1]" [attr.width]="r[2]" [attr.height]="r[3]" [attr.fill]="r[4]" />
  }
</svg>
<div class="mug-readout"><ng-content /></div>
